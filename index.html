<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>ZYC1145 · 乐子博客</title>
  <style>
    /* ---------- Minecraft 字体引入 ---------- */
    @font-face {
      font-family: 'Monocraft';
      src: url('https://cdn.jsdelivr.net/gh/IdreesInc/Monocraft@main/dist/Monocraft-ttf/Monocraft.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* ---------- 主题变量：浅色模式 ---------- */
    :root {
      --bg-body: #f4faf7;
      --bg-card: #ffffff;
      --bg-subtle: #e8f5ee;
      --bg-highlight: #d8f3e3;
      --bg-avatar: #b7e4c7;
      --text-primary: #1b4332;
      --text-secondary: #3d5a4e;
      --text-muted: #6b8a7a;
      --text-faint: #8faa9d;
      --border-color: #2d6a4f;
      --border-soft: #d9e8e0;
      --accent: #2d6a4f;
      --accent-dark: #1b4332;
      --shadow-color: rgba(45, 106, 79, 0.15);
      --shadow-soft: rgba(45, 106, 79, 0.1);
      --btn-reset-text: #6b8a7a;
      --hero-bg: #ffffff;
      --footer-border: #d9e8e0;
    }

    /* ---------- 主题变量：深色模式 ---------- */
    html.dark {
      --bg-body: #0f1a16;
      --bg-card: #16241e;
      --bg-subtle: #1e3329;
      --bg-highlight: #2d6a4f;
      --bg-avatar: #2d6a4f;
      --text-primary: #d8f3e3;
      --text-secondary: #b7e4c7;
      --text-muted: #8fbfa8;
      --text-faint: #5e8a75;
      --border-color: #40916c;
      --border-soft: #1e3329;
      --accent: #40916c;
      --accent-dark: #52b788;
      --shadow-color: rgba(0, 0, 0, 0.4);
      --shadow-soft: rgba(0, 0, 0, 0.25);
      --btn-reset-text: #8fbfa8;
      --hero-bg: #16241e;
      --footer-border: #1e3329;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Monocraft', 'Courier New', monospace;
      background: var(--bg-body);
      color: var(--text-secondary);
      line-height: 1.6;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: unset;
    }

    .blog {
      max-width: 1000px;
      width: 100%;
      padding: 0 1.5rem 2rem;
    }

    /* ---------- 顶部导航栏 ---------- */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 0 1.2rem;
      border-bottom: 2px solid var(--border-soft);
      margin-bottom: 2.8rem;
      flex-wrap: wrap;
      gap: 0.8rem 1.2rem;
      transition: border-color 0.3s ease;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .nav-brand {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-primary);
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    .nav-links {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.45rem 1rem;
      border-radius: 0;
      transition: all 0.2s ease;
      background: transparent;
      border: 2px solid transparent;
      white-space: nowrap;
    }

    .nav-links a:hover {
      background: var(--bg-card);
      border-color: var(--border-color);
      color: var(--text-primary);
      box-shadow: 3px 3px 0 var(--shadow-color);
    }

    .nav-links a.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent-dark);
      box-shadow: 3px 3px 0 var(--shadow-color);
    }

    .nav-links a.active:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
      color: #ffffff;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      background: var(--bg-subtle);
      border: 2px solid var(--border-color);
      border-radius: 0;
      color: var(--accent);
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 3px 3px 0 var(--shadow-color);
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      background: var(--accent);
      color: #ffffff;
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--shadow-color);
    }

    .theme-toggle:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 var(--shadow-color);
    }

    /* ---------- 实时时钟条 ---------- */
    .clock-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
      padding: 0.9rem 1.4rem;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      box-shadow: 4px 4px 0 var(--shadow-soft);
      flex-wrap: wrap;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .clock-time {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.06em;
      transition: color 0.3s ease;
    }

    .clock-date {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      transition: color 0.3s ease;
    }

    .clock-sep {
      width: 2px;
      height: 1.4rem;
      background: var(--border-color);
      transition: background 0.3s ease;
    }

    /* ---------- 巨型标语区域 ---------- */
    .hero {
      text-align: center;
      margin: 0 0 2.8rem;
      padding: 1.8rem 0.8rem 2rem;
      background: var(--hero-bg);
      border-radius: 0;
      box-shadow: 6px 6px 0 var(--shadow-soft);
      border: 2px solid var(--border-color);
      transition: box-shadow 0.2s, background 0.3s ease, border-color 0.3s ease;
    }

    .hero:hover {
      box-shadow: 8px 8px 0 var(--shadow-color);
    }

    .hero-big {
      font-size: clamp(2.2rem, 10vw, 5rem);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.02em;
      color: var(--text-primary);
      margin-bottom: 0.6rem;
      word-break: break-word;
      transition: color 0.3s ease;
    }

    .hero-big:hover {
      color: var(--accent);
    }

    .hero-sub {
      font-size: clamp(0.9rem, 3vw, 1.15rem);
      color: var(--text-secondary);
      font-weight: 400;
      max-width: 500px;
      margin: 0 auto;
      padding: 0 0.5rem;
      letter-spacing: 0.02em;
      line-height: 1.5;
      transition: color 0.3s ease;
    }

    .hero-sub strong {
      font-weight: 600;
      color: var(--text-primary);
      background: var(--bg-highlight);
      padding: 0.1rem 0.6rem;
      border-radius: 0;
      border: 1px solid var(--border-color);
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    html.dark .hero-sub strong {
      color: #0f1a16;
      background: #52b788;
    }

    /* ---------- 个人资料卡片 ---------- */
    .profile {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2rem;
      background: var(--bg-card);
      padding: 2rem 2rem;
      border-radius: 0;
      box-shadow: 6px 6px 0 var(--shadow-soft);
      margin-bottom: 2rem;
      border: 2px solid var(--border-color);
      transition: box-shadow 0.2s, background 0.3s ease, border-color 0.3s ease;
    }

    .profile:hover {
      box-shadow: 8px 8px 0 var(--shadow-color);
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 0;
      background: var(--bg-avatar);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 600;
      color: var(--text-primary);
      flex-shrink: 0;
      box-shadow: 4px 4px 0 var(--shadow-color);
      transition: transform 0.2s, background 0.3s ease, color 0.3s ease;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: 2px solid var(--border-color);
    }

    html.dark .avatar {
      color: #d8f3e3;
    }

    .avatar:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--shadow-color);
    }

    .profile-info {
      flex: 1;
      min-width: 200px;
    }

    .profile-name {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      line-height: 1.2;
      margin-bottom: 0.4rem;
      color: var(--text-primary);
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    /* 桑晨曦是个乐子 —— 替换了原个人简介 */
    .profile-tagline {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 1.3rem;
      line-height: 1.6;
      font-weight: 400;
      transition: color 0.3s ease;
    }

    .profile-tagline strong {
      font-weight: 600;
      color: var(--text-primary);
      background: var(--bg-highlight);
      padding: 0.1rem 0.6rem;
      border: 1px solid var(--border-color);
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    html.dark .profile-tagline strong {
      color: #0f1a16;
      background: #52b788;
    }

    .social {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 1.4rem;
    }

    .social a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      background: var(--bg-subtle);
      border-radius: 0;
      color: var(--accent);
      font-size: 1.1rem;
      text-decoration: none;
      transition: all 0.2s ease;
      border: 2px solid var(--border-color);
      box-shadow: 3px 3px 0 var(--shadow-color);
    }

    .social a:hover {
      background: var(--accent);
      color: #ffffff;
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--shadow-color);
      border-color: var(--accent-dark);
    }

    .social a .icon-bilibili::before {
      content: "B";
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.5px;
      display: inline-block;
      line-height: 1;
      text-transform: uppercase;
    }

    /* ---------- 联系方式 ---------- */
    .contact {
      margin-top: 0.2rem;
    }

    .contact-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
      transition: color 0.3s ease;
    }

    .contact-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1.4rem;
      list-style: none;
    }

    .contact-list li {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
      transition: color 0.3s ease;
    }

    .contact-list li .icon-mail {
      font-style: normal;
      font-size: 0.95rem;
      color: var(--accent);
      transition: color 0.3s ease;
    }

    .contact-list a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 2px dashed var(--bg-avatar);
      padding-bottom: 1px;
      transition: all 0.2s;
    }

    .contact-list a:hover {
      color: var(--text-primary);
      border-bottom-color: var(--accent);
    }

    /* ---------- 好玩区域网格 ---------- */
    .fun-zone {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .fun-card {
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      box-shadow: 5px 5px 0 var(--shadow-soft);
      padding: 1.5rem 1.4rem;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s, background 0.3s ease, border-color 0.3s ease;
    }

    .fun-card:hover {
      box-shadow: 7px 7px 0 var(--shadow-color);
    }

    .fun-card-title {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.3s ease;
    }

    .fun-card-title::before {
      content: "▸";
      color: var(--accent);
      font-size: 0.9rem;
    }

    /* 一言机 */
    .quote-text {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--text-primary);
      margin-bottom: 1.2rem;
      flex: 1;
      min-height: 3.4rem;
      transition: color 0.3s ease;
    }

    /* 乐子骰子 */
    .dice-display {
      font-size: 3.5rem;
      text-align: center;
      margin: 0.5rem 0 1.2rem;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      transition: color 0.3s ease, transform 0.15s;
      line-height: 1;
    }

    .dice-display.rolling {
      animation: diceRoll 0.4s ease;
    }

    @keyframes diceRoll {
      0%   { transform: rotate(0deg) scale(1); }
      25%  { transform: rotate(-18deg) scale(1.15); }
      50%  { transform: rotate(14deg) scale(0.95); }
      75%  { transform: rotate(-8deg) scale(1.08); }
      100% { transform: rotate(0deg) scale(1); }
    }

    /* 点击彩蛋 */
    .egg-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 0.8rem;
    }

    .egg-face {
      font-size: 3.2rem;
      line-height: 1;
      transition: transform 0.15s;
      cursor: pointer;
      user-select: none;
    }

    .egg-face:active {
      transform: scale(0.88);
    }

    .egg-hint {
      font-size: 0.78rem;
      color: var(--text-faint);
      transition: color 0.3s ease;
    }

    /* 通用小按钮 */
    .fun-btn {
      background: var(--bg-subtle);
      border: 2px solid var(--border-color);
      padding: 0.45rem 1.1rem;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 3px 3px 0 var(--shadow-color);
      font-family: 'Monocraft', 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .fun-btn:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent-dark);
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--shadow-color);
    }

    .fun-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 var(--shadow-color);
    }

    /* ---------- 乐子计数器 ---------- */
    .fun-counter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
      padding: 1rem 1.5rem;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      box-shadow: 4px 4px 0 var(--shadow-soft);
      flex-wrap: wrap;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .fun-counter .count-num {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--text-primary);
      min-width: 3rem;
      text-align: center;
      transition: color 0.3s ease;
    }

    .fun-counter button {
      background: var(--bg-subtle);
      border: 2px solid var(--border-color);
      padding: 0.45rem 1.3rem;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Monocraft', 'Courier New', monospace;
      box-shadow: 3px 3px 0 var(--shadow-color);
    }

    .fun-counter button:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent-dark);
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--shadow-color);
    }

    .fun-counter button:active {
      transform: translate(3px, 3px);
      box-shadow: 0 0 0 var(--shadow-color);
    }

    .fun-counter .fun-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 400;
      transition: color 0.3s ease;
    }

    #funReset {
      background: transparent;
      color: var(--btn-reset-text);
      box-shadow: none;
    }

    #funReset:hover {
      background: var(--accent);
      color: #ffffff;
      box-shadow: none;
      transform: translate(2px, 2px);
    }

    /* ---------- 页脚 ---------- */
    .footer {
      margin-top: 3.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-faint);
      border-top: 2px solid var(--footer-border);
      padding-top: 2rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      transition: color 0.3s ease, border-color 0.3s ease;
    }

    /* ---------- 响应式 ---------- */
    @media (max-width: 640px) {
      .blog {
        padding: 0 1rem 1.5rem;
      }

      .navbar {
        padding: 1rem 0 0.8rem;
        margin-bottom: 2rem;
      }

      .hero {
        padding: 1.2rem 0.5rem 1.5rem;
        margin-bottom: 2rem;
      }

      .hero-big {
        font-size: clamp(1.8rem, 12vw, 3.2rem);
      }

      .clock-time {
        font-size: 1.2rem;
      }

      .profile {
        flex-direction: column;
        text-align: center;
        padding: 1.8rem 1.2rem;
        gap: 1.2rem;
      }

      .avatar {
        width: 100px;
        height: 100px;
        font-size: 1.6rem;
      }

      .profile-name {
        font-size: 1.6rem;
      }

      .social {
        justify-content: center;
      }

      .contact-list {
        justify-content: center;
      }

      .fun-counter {
        flex-direction: column;
        gap: 0.7rem;
        padding: 1rem 1.2rem;
      }

      .fun-zone {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 420px) {
      .nav-links a {
        padding: 0.35rem 0.8rem;
        font-size: 0.8rem;
      }

      .nav-brand {
        font-size: 1.1rem;
      }

      .fun-counter button {
        padding: 0.35rem 1rem;
        font-size: 0.8rem;
      }

      .contact-list li {
        font-size: 0.75rem;
      }

      .clock-bar {
        flex-direction: column;
        gap: 0.4rem;
      }

      .clock-sep {
        display: none;
      }
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .icon {
      font-style: normal;
      display: inline-block;
      line-height: 1;
    }

    .icon-github::before { content: "⌨"; font-weight: 400; }

    /* 返回顶部 */
    .back-to-top {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--accent);
      color: #ffffff;
      border: 2px solid var(--accent-dark);
      width: 3rem;
      height: 3rem;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--shadow-color);
      transition: all 0.25s ease;
      opacity: 0;
      visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .back-to-top.show {
      opacity: 1;
      visibility: visible;
    }

    .back-to-top:hover {
      background: var(--accent-dark);
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--shadow-color);
    }

    @media (max-width: 640px) {
      .back-to-top {
        bottom: 1.2rem;
        right: 1.2rem;
        width: 2.6rem;
        height: 2.6rem;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="blog">
    <!-- 顶部导航栏 -->
    <nav class="navbar">
      <div class="nav-left">
        <a href="#" class="nav-brand">ZYC1145·乐子</a>
        <div class="nav-links">
          <a href="#profile" class="active">个人</a>
          <a href="#social-links">社交链接</a>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色模式" title="切换主题">☾</button>
    </nav>

    <!-- 实时时钟条 -->
    <div class="clock-bar">
      <span class="clock-time" id="clockTime">--:--:--</span>
      <span class="clock-sep"></span>
      <span class="clock-date" id="clockDate">----年--月--日 星期-</span>
    </div>

    <!-- 巨型标语区 -->
    <section class="hero">
      <div class="hero-big">看到的都是给</div>
      <p class="hero-sub">刘轩廷是个<strong>乐子</strong>。</p>
    </section>

    <!-- 个人资料卡片 -->
    <header class="profile" id="profile">
      <div class="avatar" aria-label="头像">ZYC</div>

      /* ---------- 0. 主题切换 ---------- */
      const themeToggle = document.getElementById('themeToggle');
      const htmlEl = document.documentElement;

      function getInitialTheme() {
        try {
          const saved = localStorage.getItem('zyc1145_theme');
          if (saved === 'dark' || saved === 'light') return saved;
        } catch (e) {}
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          return 'dark';
        }
        return 'light';
      }

      function applyTheme(theme) {
        if (theme === 'dark') {
          htmlEl.classList.add('dark');
          if (themeToggle) { themeToggle.textContent = '☀'; themeToggle.title = '切换到浅色模式'; }
        } else {
          htmlEl.classList.remove('dark');
          if (themeToggle) { themeToggle.textContent = '☾'; themeToggle.title = '切换到深色模式'; }
        }
        try { localStorage.setItem('zyc1145_theme', theme); } catch (e) {}
      }

      let currentTheme = getInitialTheme();
      applyTheme(currentTheme);

      if (themeToggle) {
        themeToggle.addEventListener('click', () => {
          currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
          applyTheme(currentTheme);
        });
      }

      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          let saved = null;
          try { saved = localStorage.getItem('zyc1145_theme'); } catch (err) {}
          if (!saved) {

            applyTheme(currentTheme);
          }
        });

      function updateClock() {
        const now = new Date();
        if (clockTime) {
          clockTime.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
        }
        if (clockDate) {
          clockDate.textContent = now.getFullYear() + '年' + pad(now.getMonth() + 1) + '月' + pad(now.getDate()) + '日 星期' + weekDays[now.getDay()];
        }
      }
